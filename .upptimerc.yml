# Upptime (https://upptime.js.org) config for the Filter / session-host stack
owner: sitg
repo: status

sites:
  - name: Filter landing
    url: https://telegram.replisor.com
  - name: Filter console
    url: https://telegram.replisor.com/console
  - name: Filter API
    url: https://telegram.replisor.com/api/health
    __dangerous__body_down_if_text_missing: '"ok":true'
  - name: TDLib session host (via API)
    url: https://telegram.replisor.com/api/tdlib/doctor
    __dangerous__body_down_if_text_missing: '"ok":true'

status-website:
  baseUrl: /status
  logoUrl: https://telegram.replisor.com/favicon.ico
  name: Filter status
  introTitle: "**Filter** & Telegram session-host service status"
  introMessage: Live uptime and response times, checked every 5 minutes.
  navbar:
    - title: Status
      href: /
    - title: App
      href: https://telegram.replisor.com

i18n:
  footer: Powered by [Upptime](https://upptime.js.org)
